<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<title>디밀리언 영업 관리</title>
<style>
/* Layout: one sales console — 업체 tab = status board + list | sticky detail; 지도 tab = sticky map | list+detail; 지원사업 tab = org graph + panel. Stacks on phone. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --sunken:#f1f3f6; --ink:#1b1f24; --ink2:#6b7480; --line:#e3e7ec;
  --land:#e6eaef; --land-hi:#cdd8ea; --land-edge:#ffffff; --sea:#f6f7f9;
  --accent:#2f5bd7; --accent-ink:#ffffff; --accent-soft:#eaf0ff;
  --ok:#147a4b; --ok-soft:#e6f4ec; --warn:#a86100; --warn-soft:#fdf1dd; --bad:#b3261e; --bad-soft:#fdecea;
  --s-lead:#8a929c; --s-meet:#2f5bd7; --s-prop:#c27a0e; --s-win:#147a4b; --s-stop:#b3261e;
  --s-part:#7a5aa8;
  --pg-min:#1d3557; --pg-min-fg:#ffffff; --pg-ag:#dbe7f6; --pg-ag-fg:#13325c; --pg-op:#d9f0ec; --pg-op-fg:#10463d; --pg-prog:#2f6fd1; --pg-sel:#e0920b; --pg-edge:#7b8796; --pg-grid:#e9ebe6;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:var(--font);
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111418; --surface:#1a1e24; --sunken:#22272e; --ink:#e8ebef; --ink2:#9aa3ae; --line:#2c323b;
  --land:#272d35; --land-hi:#33415a; --land-edge:#111418; --sea:#111418;
  --accent:#6d93f2; --accent-ink:#0d1526; --accent-soft:#1f2b48;
  --ok:#4cb07a; --ok-soft:#173326; --warn:#e0a93a; --warn-soft:#3a2c12; --bad:#ef7b72; --bad-soft:#3d1d1b;
  --s-lead:#8d96a2; --s-meet:#6d93f2; --s-prop:#e0a93a; --s-win:#4cb07a; --s-stop:#ef7b72;
  --s-part:#a88be0;
  --pg-min:#5b8def; --pg-min-fg:#0b1220; --pg-ag:#1e3350; --pg-ag-fg:#cfe0f7; --pg-op:#173b36; --pg-op-fg:#c6ece5; --pg-prog:#5b8def; --pg-sel:#fbbf24; --pg-edge:#7d8a9c; --pg-grid:#1a1f27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111418; --surface:#1a1e24; --sunken:#22272e; --ink:#e8ebef; --ink2:#9aa3ae; --line:#2c323b;
  --land:#272d35; --land-hi:#33415a; --land-edge:#111418; --sea:#111418;
  --accent:#6d93f2; --accent-ink:#0d1526; --accent-soft:#1f2b48;
  --ok:#4cb07a; --ok-soft:#173326; --warn:#e0a93a; --warn-soft:#3a2c12; --bad:#ef7b72; --bad-soft:#3d1d1b;
  --s-lead:#8d96a2; --s-meet:#6d93f2; --s-prop:#e0a93a; --s-win:#4cb07a; --s-stop:#ef7b72;
  --s-part:#a88be0;
  --pg-min:#5b8def; --pg-min-fg:#0b1220; --pg-ag:#1e3350; --pg-ag-fg:#cfe0f7; --pg-op:#173b36; --pg-op-fg:#c6ece5; --pg-prog:#5b8def; --pg-sel:#fbbf24; --pg-edge:#7d8a9c; --pg-grid:#1a1f27; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;margin:0}
.wrap{padding-inline:16px;padding-block:14px 28px;max-width:1440px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-size:12px;font-weight:500;color:var(--ink2);letter-spacing:.02em}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--ink2);white-space:nowrap}
.stat b{font-family:var(--mono);color:var(--ink);font-weight:500;margin-left:4px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.mapcard{padding:10px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.grid.mode-list{grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr)}
.grid.mode-map #colL,.grid.mode-list #colR{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px)}
.grid.mode-list #colR{max-height:calc(100vh - 16px);overflow:auto;overscroll-behavior:contain;border-radius:var(--r)}
@media (max-width:900px){.grid.mode-list{grid-template-columns:1fr}.grid.mode-map #colL,.grid.mode-list #colR{position:static;max-height:none;overflow:visible}}
.maphead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:2px 4px 8px}
.crumb{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.crumb button{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.crumb button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--ink2)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
svg.map{width:100%;height:auto;display:block;max-height:76vh}
.prov{fill:var(--land);stroke:var(--land-edge);stroke-width:1.2;cursor:pointer;transition:fill .15s}
.prov.has{fill:var(--land-hi)}
.prov:hover{fill:var(--accent-soft)}
.muni{fill:var(--land);stroke:var(--land-edge);stroke-width:.5;cursor:pointer}
.muni.has{fill:var(--land-hi)}
.muni.sel{fill:var(--accent-soft);stroke:var(--accent);stroke-width:.8}
.muni:hover{fill:var(--accent-soft)}
.plabel{font-size:11px;fill:var(--ink2);pointer-events:none;font-weight:600;text-anchor:middle}
.mlabel{font-size:4.2px;fill:var(--ink2);pointer-events:none;text-anchor:middle;font-weight:500}
.pin{cursor:pointer;stroke:var(--surface)}
.pin:hover,.pin.sel{stroke:var(--ink)}
.count{font-family:var(--mono);fill:var(--ink);font-size:10px;text-anchor:middle;pointer-events:none}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px}
.toolbar input[type=search]{flex:1 1 180px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.toolbar select{width:auto;flex:0 0 auto}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:7px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;font:inherit;color:inherit;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--sunken)}
.row.sel{background:var(--accent-soft)}
.row .bar{width:4px;align-self:stretch;border-radius:2px}
.row .nm{font-weight:600}
.row .sub{font-size:12px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .when{font-family:var(--mono);font-size:11.5px;color:var(--ink2);text-align:right;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line);white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.chip.ch-in{color:var(--s-meet)} .chip.ch-out{color:var(--accent)}
.empty{padding:22px 16px;color:var(--ink2);text-align:center}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.panelhead h2{font-size:14px;margin:0}
.muted{color:var(--ink2);font-size:12px}
.detail{padding:14px}
.dtitle{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px}
.dtitle h3{font-size:18px;margin:0}
.steps{display:flex;gap:3px;margin:10px 0 14px;flex-wrap:wrap}
.steps span{flex:1 1 0;min-width:44px;font-size:10.5px;text-align:center;padding:4px 2px;border-radius:5px;background:var(--sunken);color:var(--ink2)}
.steps span.on{background:var(--ink);color:var(--surface);font-weight:600}
.steps span.done{background:var(--land-hi);color:var(--ink)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:13px}
.kv dt{color:var(--ink2)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sec{margin-top:16px}
.sec h4{font-size:12px;letter-spacing:.06em;color:var(--ink2);margin:0 0 8px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.next{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.next b{font-family:var(--mono);font-weight:500}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 10px}
.tl li::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--s-meet)}
.tl li.plan::before{border-color:var(--accent);border-style:dashed}
.tl li.cancel{opacity:.55}
.tl .t1{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.tl .date{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.tl .ty{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--sunken)}
.tl .sm{font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.tl .na{font-size:12px;color:var(--ink2);margin-top:2px}
.tl .acts{display:flex;gap:8px;margin-top:4px}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-size:12px;font-weight:600}
.linkbtn:focus-visible{outline:2px solid var(--accent);border-radius:3px}
form.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
form.f label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);min-width:0}
form.f .full{grid-column:1/-1}
@media (max-width:520px){form.f{grid-template-columns:1fr}}
.formbar{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;grid-column:1/-1}
.upc{display:flex;flex-direction:column}
.upc button{all:unset;display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer;font-size:13px}
.upc button:hover{background:var(--sunken)}
.upc button:first-child{border-top:0}
.upc .d{font-family:var(--mono);font-size:12px;color:var(--accent)}
.notice{font-size:12px;color:var(--ink2);padding:8px 12px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
.geo{font-size:12px;color:var(--ink2)}
.danger{color:var(--s-stop)}
.tabs{display:flex;gap:3px;background:var(--sunken);border-radius:999px;padding:3px;flex-wrap:wrap}
.tab{all:unset;cursor:pointer;font-size:13px;font-weight:600;padding:5px 14px;border-radius:999px;color:var(--ink2)}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#wide{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
form.sub{margin:0 0 14px;padding:12px;background:var(--sunken);border-radius:8px}
.ai{background:var(--surface);border:1px dashed var(--accent);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.aihead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;color:var(--ink)}
.airow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.aistat{font-size:12px;color:var(--ink2);min-height:1em}
.aistat.err{color:var(--s-stop)}
.filebtn{display:inline-flex;align-items:center}
.subhead{font-size:12px;font-weight:700;color:var(--ink);border-top:1px solid var(--line);padding-top:10px}
.suggest{background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.suggest input{width:auto}
.eqs{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
details.rep{margin-top:4px;font-size:13px}
details.rep summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:12px}
details.rep .kv{margin-top:6px;grid-template-columns:100px minmax(0,1fr)}
details.rep dd{white-space:pre-line}
pre.tr{white-space:pre-wrap;font:inherit;font-size:12.5px;max-height:260px;overflow:auto;background:var(--sunken);padding:8px 10px;border-radius:6px;margin:6px 0 0}
ul.docs{list-style:none;margin:0;padding:0}
ul.docs li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
ul.docs li:first-child{border-top:0}
ul.docs a{color:var(--ink);font-weight:600;overflow-wrap:anywhere}
ul.docs .tag{background:var(--sunken);border-color:transparent}
.bom{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px}
.bomh{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bomitems{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;margin:6px 0;color:var(--ink2)}
.bomt{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px}
.bomt span{font-variant-numeric:tabular-nums}
.bom .acts{display:flex;gap:12px;margin-top:6px}
.lock{margin:-4px 0 4px}
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.item label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);min-width:0}
.item .full,.itemh{grid-column:1/-1}
.itemh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink2)}
@media (max-width:520px){.item{grid-template-columns:repeat(2,minmax(0,1fr))}}
.warn{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 10px;border-radius:6px;font-size:12.5px;color:var(--ink)}
.wpad{padding:14px 16px 20px}
.wpad h3{font-size:15px;margin:22px 0 8px}
.wpad h3:first-child{margin-top:0}
.wpad h4{font-size:13px;margin:14px 0 6px;color:var(--ink2)}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;min-width:680px}
.tbl th,.tbl td{text-align:left;padding:8px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{font-size:12px;color:var(--ink2);font-weight:600;border-top:0;white-space:nowrap}
.tbl td.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl tr.ed td{background:var(--sunken)}
.bars{display:flex;flex-direction:column;gap:7px}
.barrow{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr) 30px;gap:10px;align-items:center;font-size:13px}
.bt{height:10px;background:var(--sunken);border-radius:5px;overflow:hidden}
.bt i{display:block;height:100%;border-radius:5px}
.bv{font-family:var(--mono);font-size:12px;text-align:right}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.leaders{display:flex;flex-wrap:wrap;gap:6px}
.leaders span{font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.leaders b{font-weight:600}
.reprow{padding:10px 0;border-top:1px solid var(--line)}
.reprow .t1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.badge{font-size:11px;font-weight:700;color:var(--s-win);border:1px solid currentColor;border-radius:999px;padding:0 7px}
.wfilter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.wfilter select{width:auto}
/* 대표 보고 */
.rp-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:14px}
.wpad .rp-top h3{margin:0;font-size:18px}
.rp-top .muted{margin-top:2px}
.rp-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.rp-kpi{background:var(--sunken);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.rp-kpi b{font-family:var(--mono);font-size:24px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.rp-kpi span{font-size:12px;color:var(--ink2)}
.rp-board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:700px){.rp-board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rp-col{border-top:3px solid var(--c);padding-top:6px;min-width:0;display:flex;flex-direction:column;gap:4px}
.rp-col h5{margin:0 0 2px;font-size:12px;font-weight:600;color:var(--ink2);display:flex;justify-content:space-between}
.rp-col h5 b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.rp-col button{all:unset;cursor:pointer;font-size:13px;font-weight:600;padding:5px 8px;border-radius:6px;background:var(--sunken);overflow-wrap:anywhere}
.rp-col button:hover{background:var(--accent-soft)}
.rp-col button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rp-col .none{font-size:12px;color:var(--ink2)}
.rp-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:900px){.rp-cards{grid-template-columns:1fr}}
.rpcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin-top:12px}
.rpcard.stopped{background:var(--sunken)}
.rph{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.wpad .rph h4{margin:0;font-size:16px;color:var(--ink)}
.rpsteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px}
.rpsteps span{font-size:10.5px;text-align:center;padding:3px 2px;border-radius:5px;background:var(--sunken);color:var(--ink2)}
.rpsteps span.done{background:var(--land-hi);color:var(--ink)}
.rpsteps span.on{background:var(--ink);color:var(--surface);font-weight:600}
.rpcard.stopped .rpsteps span{background:var(--surface)}
.rpcard.stopped .rpsteps span.done{background:var(--land-hi)}
.rpkv{grid-template-columns:72px minmax(0,1fr);font-size:12.5px}
.rpkv dd.blk{color:var(--s-stop)}
.rptl{list-style:none;margin:0;padding:0 0 0 2px;display:flex;flex-direction:column;gap:7px}

/* 상세 · 단계 */
.dtitle h3{font-size:18px;font-weight:700}
.steps span,.ps,.rpsteps span{background:var(--sunken);color:var(--ink2);border-radius:6px}
.steps span.done,.ps.done,.rpsteps span.done,.rpcard.stopped .rpsteps span.done{background:var(--accent-soft);color:var(--accent)}
.steps span.on,.ps.on,.rpsteps span.on{background:var(--accent);color:var(--accent-ink)}
.next{background:var(--accent-soft)}
.alert,.warn{background:var(--warn-soft);border-left-color:var(--warn);color:var(--ink)}
.iss{background:var(--warn-soft)}
.suggest{background:var(--ok-soft)}
.tl{border-left-color:var(--line)}
.tl .ty,.rptl .ty{background:var(--sunken);font-weight:700}
.linkbtn{color:var(--accent)}
.danger{color:var(--bad)}
/* 표 */
.tbl th{font-size:11px;font-weight:700;color:var(--ink2);border-bottom:1px solid var(--line)}
.tbl th,.tbl td{padding:7px 8px}
.tbl tbody tr:hover td{background:#fafbfd}
.tbl tr.now td{background:var(--accent-soft)}
/* 다가오는 일정: 그룹 + D-day 칩 */
.upc{padding:2px 14px 10px}
.upg{margin:10px 0 2px;font-size:12px;font-weight:700;color:var(--ink2)}
.upg.late{color:var(--bad)}
.upc button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);border-top:0;cursor:pointer;font-size:13px;min-width:0}
.upc button:first-child{border-top:0}
.upc button:hover{background:#fafbfd}
.upc button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:4px}
.upc .dd{flex:none;min-width:46px;text-align:center;padding:0 7px;border-radius:999px;background:var(--sunken);color:var(--ink2);font-size:11px;font-weight:700;line-height:20px;white-space:nowrap}
.upc .dd.soon{background:var(--warn-soft);color:var(--warn)}
.upc .dd.today{background:var(--accent);color:var(--accent-ink)}
.upc .dd.late{background:var(--bad-soft);color:var(--bad)}
.upc .dt{flex:none;font-size:12px;font-weight:600;color:var(--ink2);white-space:nowrap}
.upc .nm{flex:none;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;font-weight:700;color:var(--accent)}
.upc .kd{flex:none;font-size:11px;font-weight:700;white-space:nowrap;color:var(--accent)}
.upc .kd.kn{color:var(--warn)}
.upc .wt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.upc button{flex-wrap:wrap;gap:4px 8px}.upc .wt{flex-basis:100%;white-space:normal}}
/* 캘린더 · 기타 */
.calc.today .cd{font-weight:700}
.role{background:var(--surface)}
.notice{color:var(--ink2)}
.hint{color:var(--ink2)}
/* 대표 보고 */
.rp-kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.rp-kpi b{font-size:26px;font-weight:700;letter-spacing:-.5px}
.rp-col{border-top-width:2px;gap:0}
.rp-col h5{font-weight:700;margin-bottom:4px}
.rp-col h5 b{font-weight:700}
.rp-col button{background:none;border-radius:0;padding:6px 4px;border-bottom:1px solid var(--line);font-weight:500}
.rp-col button:hover{background:#fafbfd;color:var(--accent)}
.rpcard{border-radius:10px}
.roles div{border:1px solid var(--line);background:var(--surface)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .row:hover,:root:not([data-theme="light"]) .upc button:hover,:root:not([data-theme="light"]) .tbl tbody tr:hover td,:root:not([data-theme="light"]) .rp-col button:hover{background:var(--sunken)}}
:root[data-theme="dark"] .row:hover,:root[data-theme="dark"] .upc button:hover,:root[data-theme="dark"] .tbl tbody tr:hover td,:root[data-theme="dark"] .rp-col button:hover{background:var(--sunken)}

/* ── 업무 센터 스타일 ───────────────── */
:root{--bg:#f4f5f7;--line:#e4e7ec;--accent:#2563eb;--accent-soft:#eaf1ff;--s-meet:#2563eb;--wc-head:#ffffff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#6d93f2;--accent-soft:#1f2b48;--s-meet:#6d93f2;--wc-head:#1a1e24}}
:root[data-theme="dark"]{--accent:#6d93f2;--accent-soft:#1f2b48;--s-meet:#6d93f2;--wc-head:#1a1e24}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--wc-head)}
header.top{top:env(safe-area-inset-top,0px);padding-top:0;background:var(--wc-head)}
.topbar{display:flex;flex-wrap:nowrap;align-items:stretch;gap:0 28px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));min-height:60px}
header.top h1{flex:none;align-self:center;font-size:16px;flex-direction:column;gap:0;line-height:1.25}
header.top h1 small{font-size:11px}
header.top .tabs{flex:1;min-width:0;display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0;padding:0;gap:2px;background:none;border-radius:0}
header.top .tabs::-webkit-scrollbar{display:none}
header.top .tab{all:unset;cursor:pointer;flex:none;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:600;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
header.top .tab:hover{color:var(--ink)}
header.top .tab.on{color:var(--accent);border-bottom-color:var(--accent);background:none}
header.top .tab:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:4px}
header.top .hright{flex:none;align-self:center;gap:8px;font-size:12px;color:var(--ink2)}
header.top .role{border:0;padding:0;background:none}
.today{white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:900px){.topbar{flex-wrap:wrap;gap:0 12px;min-height:0}header.top h1{padding:10px 0 4px}header.top .hright{margin-left:auto}header.top .tabs{order:3;flex-basis:100%}header.top .tab{padding:10px 10px}}
.wrap{max-width:1280px;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.phead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.phead h2{font-size:21px;font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance}
.stats{margin-bottom:14px}
#wide.bare{background:none;border:0}
/* 한눈에 보기 */
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px;min-width:0}
.hh{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin-bottom:10px}
.hh h3{font-size:15px;font-weight:700;margin:0}
.hh .muted{font-size:12px}
.hh .cnt{font-weight:500;color:var(--ink2);font-size:13px;margin-left:4px}
.hempty{color:var(--ink2);font-size:13px;padding:6px 0}
.sgrp{font-size:12.5px;font-weight:700;color:var(--ink2);margin:12px 0 4px}
.sgrp:first-of-type{margin-top:4px}
.sgrp.late{color:var(--bad)}
.srow{display:grid;grid-template-columns:18px auto auto auto auto minmax(0,1fr);gap:10px;align-items:center;padding:6px 0;font-size:13.5px;min-width:0}
.sck{width:16px;height:16px;margin:0;padding:0;accent-color:var(--accent);cursor:pointer}
.dchip{display:inline-block;min-width:52px;text-align:center;font-size:11.5px;font-weight:700;line-height:22px;padding:0 8px;border-radius:6px;background:var(--sunken);color:var(--ink2);white-space:nowrap}
.dchip.late{background:var(--bad-soft);color:var(--bad)}
.dchip.today{background:var(--accent);color:var(--accent-ink)}
.dchip.soon{background:var(--warn-soft);color:var(--warn)}
.sdate{font-size:13px;color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.colink,.ut,.pcn{all:unset;cursor:pointer;color:var(--accent);font-weight:700;white-space:nowrap}
.colink:hover,.ut:hover,.pcn:hover{text-decoration:underline}
.colink:focus-visible,.ut:focus-visible,.pcn:focus-visible,.more:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.skind{font-size:11.5px;font-weight:700;color:var(--warn);white-space:nowrap}
.skind.sk-act{color:var(--accent)} .skind.sk-due{color:var(--s-part)}
.stxt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:640px){.srow{grid-template-columns:18px auto minmax(0,1fr);row-gap:2px}.srow .sdate{grid-column:3}.srow .colink{grid-column:2/4}.srow .skind{grid-column:2}.srow .stxt{grid-column:3;white-space:normal}}
.ugrp{font-size:13px;font-weight:700;margin:14px 0 6px}
.ugrp b{color:var(--ink2);font-weight:600;margin-left:2px}
.urow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.ugrp + .urow{border-top:0}
.spill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--k) 45%,transparent);color:var(--k);background:var(--surface);white-space:nowrap}
.spill i{width:7px;height:7px;border-radius:50%;background:var(--k)}
.ubody{min-width:0}
.ut{white-space:normal;color:var(--ink)}
.us{font-size:12.5px;color:var(--ink2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ulast{font-size:12px;color:var(--ink2);white-space:nowrap}
.ulast.stale{color:var(--bad)}
@media (max-width:640px){.urow{grid-template-columns:minmax(0,1fr)}.ulast{order:3}}
.cbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:4px 0 12px}
.cbar .seg button b{font-weight:600;color:var(--ink2);margin-left:2px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px;align-items:start}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pch{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:2px}
.pcn{font-size:15.5px;color:var(--ink);white-space:normal}
.pch .spill{margin-left:auto}
.pcbar{display:grid;grid-template-columns:auto minmax(40px,1fr) auto auto;gap:10px;align-items:center;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pb{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.pb i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.pcbar .dchip{min-width:44px;line-height:20px;font-size:11px}
.pcmeta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--ink2);align-items:center}
.pcsub{font-size:12.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pcs{font-size:12px;font-weight:700;color:var(--ink2);margin-top:6px}
.pcl{display:flex;gap:8px;align-items:center;font-size:13px;min-width:0}
.pcl .dchip{min-width:44px;line-height:20px;font-size:11px;flex:none}
.pcl .dt{flex:none;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pcl .ty{flex:none;font-size:11px;font-weight:700;padding:0 7px;border-radius:999px;background:var(--sunken)}
.pcl .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{all:unset;cursor:pointer;font-size:12px;color:var(--ink2);align-self:flex-start}
.more:hover{color:var(--accent)}
/* 업체 관리: 왼쪽 목록 + 오른쪽 상세 */
.board{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.bk{flex-direction:row;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.bk::before{display:none}
.bk .d{display:none}
.bk .l{gap:6px;font-size:13px}
.bk .l::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);align-self:center}
.bk .l b{font-size:13px;font-weight:700}
.bk.on{background:var(--accent-soft);border-color:var(--accent)}
.grid.mode-list{grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px}
.grid.mode-list #colL{position:sticky;top:calc(var(--hh,0px) + env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - var(--hh,0px) - 24px);overflow:auto;overscroll-behavior:contain;border-radius:10px}
.grid.mode-list #colR{position:static;max-height:none;overflow:visible}
.grid.mode-list .toolbar{gap:6px}
.grid.mode-list .toolbar input[type=search]{flex-basis:100%}
.grid.mode-list .toolbar select{flex:1 1 calc(50% - 3px);width:auto;min-width:0}
.grid.mode-list .toolbar .chk{flex:1}
.grid.mode-list .row{grid-template-columns:3px minmax(0,1fr) auto;padding:9px 12px}
.grid.mode-list .row .when{font-size:11px}
@media (max-width:900px){.grid.mode-list{grid-template-columns:1fr}.grid.mode-list #colL{position:static;max-height:none;overflow:visible}}
.detail{padding:18px 20px}
.dtabs{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0 4px;border-bottom:1px solid var(--line);padding-bottom:10px}
.dtab{all:unset;cursor:pointer;font-size:13.5px;font-weight:600;padding:6px 12px;border-radius:8px;color:var(--ink2)}
.dtab b{font-weight:600;margin-left:2px}
.dtab:hover{color:var(--ink)}
.dtab.on{background:var(--accent-soft);color:var(--accent)}
.dtab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tl li.todayline{padding:2px 0 14px 0;margin-left:-15px}
.tl li.todayline::before{display:none}
.tl li.todayline span{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--accent)}
.tl li.todayline span::after{content:"";flex:1;border-top:1.5px dashed var(--accent)}

/* 과제 진행 */
.ptks h4{display:flex;gap:8px;align-items:baseline}
.ptk{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:7px;margin-bottom:8px;background:var(--surface)}
.ptk-h{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12.5px}
.ptk-n{all:unset;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink)}
.ptk-n:hover{color:var(--accent);text-decoration:underline}
.ptk-n:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.ptk-bar{display:grid;grid-template-columns:minmax(60px,180px) minmax(0,1fr);gap:10px;align-items:center;font-size:12.5px;color:var(--ink2)}
.ptk-bar b{color:var(--ink)}
.ptk-now{font-size:13px;background:var(--accent-soft);border-radius:6px;padding:6px 10px}
.ptk-rows{display:flex;flex-direction:column;gap:4px}
.ptk-ag{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12px}
.ptk-ag b{font-weight:700;color:var(--ink2);margin-right:2px}
.agp{padding:1px 8px;border-radius:999px;background:var(--sunken);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agp.ag-hold{background:var(--warn-soft);color:var(--warn)}
.dchip.okc{background:var(--ok-soft);color:var(--ok)}
.ptk-s{padding:8px 10px;gap:5px;margin:2px 0 0;background:var(--bg)}
.ptk-s .ptk-h{justify-content:space-between}
.ptk-s .ptk-n{font-size:13px}
.ptk-c{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pjrow-p{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink2);margin-top:4px;min-width:0}
.pjrow-p .pb{width:70px;flex:none}
.pjrow-p .dchip{min-width:40px;line-height:18px;font-size:10.5px;flex:none}
.pjrow-p > span:not(.pb):not(.pjsub1){white-space:nowrap}
.pjco{min-width:110px;word-break:keep-all}
.pjt th,.pjt td{word-break:keep-all}
.pjsub1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.mslist{display:flex;flex-direction:column}
.msr{display:grid;grid-template-columns:16px 64px 60px 48px minmax(0,1fr);gap:8px;align-items:center;padding:5px 0;font-size:13px;cursor:pointer}
.msr input{width:15px;height:15px;margin:0;padding:0;accent-color:var(--accent)}
.msr .msd{font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.msr .dchip{min-width:0;line-height:20px;font-size:11px;padding:0 6px}
.msr .msk{font-size:11px;font-weight:700;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msr.done .mst{color:var(--ink2)}
.msr.late .mst{color:var(--bad);font-weight:600}
.todayln{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--accent);margin:6px 0}
.todayln::after{content:"";flex:1;border-top:1.5px dashed var(--accent)}
.msu{font-size:12px;font-weight:700;color:var(--ink2);margin:10px 0 2px}
.agg{margin-bottom:10px}
.agh{font-size:13px;font-weight:700;margin-bottom:4px}
.agr{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:6px 0;border-top:1px solid var(--line)}
.agsel{width:auto;font-size:12px;padding:2px 6px;border-radius:999px;font-weight:600}
.agsel.ag-doing{color:var(--accent);border-color:var(--accent)}
.agsel.ag-hold{color:var(--warn);border-color:var(--warn)}
.agsel.ag-done{color:var(--ok);border-color:var(--ok)}
.agt{font-size:13px;font-weight:600}
.agr.done .agt{color:var(--ink2);font-weight:500}
.agm{font-size:12px;color:var(--ink2);margin-top:2px;white-space:pre-line}
.agd summary{cursor:pointer;font-size:12px;color:var(--ink2);padding:4px 0}
@media (max-width:560px){.msr{grid-template-columns:16px 56px minmax(0,1fr)}.msr .dchip{grid-column:2}.msr .msk{display:none}.msr .mst{grid-column:3;grid-row:1/3}}

/* 한눈에 보기 v3 */
.guide{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;background:var(--accent-soft);border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px}
.guide > b{color:var(--accent)}
.guide ol{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 18px;flex:1;min-width:0;counter-reset:g}
.guide li{counter-increment:g}
.guide li::before{content:counter(g);display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;margin-right:6px}
.guide i{font-style:normal;font-weight:600}
.pipe2{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin-bottom:14px}
.pp{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:96px;flex:1 1 96px;padding:10px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);position:relative}
.pp::before{content:"";position:absolute;left:14px;right:14px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--c)}
.pp .pl{font-size:12px;color:var(--ink2);font-weight:600}
.pp b{font-size:22px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.pp:hover{border-color:var(--accent)}
.pp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pp.warnp{--c:var(--warn);background:var(--warn-soft);border-color:transparent}
.pp.warnp b{color:var(--warn)}
.pa{align-self:center;color:var(--ink2);font-size:16px}
.pgap{flex:0 0 10px}
@media (max-width:700px){.pa,.pgap{display:none}.pp{flex-basis:30%;min-width:0}}
.hgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.hgrid .hcard{margin-bottom:16px}
@media (max-width:900px){.hgrid{grid-template-columns:1fr;gap:0}}
.trow{display:grid;grid-template-columns:18px auto minmax(0,1fr);gap:10px;align-items:start;padding:7px 0;border-top:1px solid var(--line)}
.sgrp + .trow{border-top:0}
.trow .sck{margin-top:3px}
.tb{min-width:0}

function geocode(addr, regionText){
  const s = String((addr||'') + ' ' + (regionText||'')).replace(/\s+/g,'');
  if (!s || !MAP) return {sido:'', sgg:''};
  let sido = '';
  for (const [code, al] of Object.entries(PROV_ALIAS)) { if (al.some(a => s.includes(a))) { sido = code; break; } }
  const cands = MAP.munis.filter(m => !sido || m.p === sido);
  let best = null;
  for (const m of cands) { if (s.includes(m.n)) { if (!best || m.n.length > best.n.length) best = m; } }

  if (best && !sido) sido = best.p;
  return {sido, sgg: best ? best.c : ''};

  return {x: base.x + Math.cos(a)*dist, y: base.y + Math.sin(a)*dist};
}

function wireHome(w){
  const goBucket = k => { tab = 'list'; view.bucket = k; view.sel = null; try { localStorage.setItem('dm.tab2', tab); } catch {} scrollTo({top:0}); renderAll(); };
  w.querySelectorAll('[data-bucket]').forEach(b => b.onclick = () => goBucket(b.dataset.bucket));
  w.querySelectorAll('[data-wk]').forEach(b => b.onclick = () => { const v = Number(b.dataset.wk); view.homeWeek = v === 0 ? 0 : (view.homeWeek || 0) + v; renderWide(); });
  w.querySelectorAll('article.kc[data-gopj]').forEach(r => { const go = e => { if (e.target.closest('button')) return; goProject(r.dataset.gopj); }; r.onclick = go; r.onkeydown = e => { if (e.key === 'Enter') goProject(r.dataset.gopj); }; });
  w.querySelectorAll('article.kc[data-go]').forEach(r => { const go = e => { if (e.target.closest('button')) return; goCompany(r.dataset.go); }; r.onclick = go; r.onkeydown = e => { if (e.key === 'Enter') goCompany(r.dataset.go); }; });
  w.querySelectorAll('button[data-go]').forEach(b => b.onclick = e => { e.stopPropagation(); goCompany(b.dataset.go); });
  if ($('lateMore')) $('lateMore').onclick = () => { view.lateMore = !view.lateMore; renderWide(); };
  w.querySelectorAll('tr[data-gopj]').forEach(r => { const go = () => goProject(r.dataset.gopj); r.onclick = go; r.onkeydown = e => { if (e.key === 'Enter') go(); }; });
  w.querySelectorAll('tr[data-go]').forEach(r => { const go = () => goCompany(r.dataset.go); r.onclick = go; r.onkeydown = e => { if (e.key === 'Enter') go(); }; });
  w.querySelectorAll('button[data-gopj]').forEach(b => b.onclick = e => { e.stopPropagation(); goProject(b.dataset.gopj); });
  if ($('homeMore')) $('homeMore').onclick = () => { view.homeMore = !view.homeMore; renderWide(); };
  if ($('stallMore')) $('stallMore').onclick = () => { view.stallMore = !view.stallMore; renderWide(); };
  if ($('guideOff')) $('guideOff').onclick = () => { try { localStorage.setItem('dm.guideOff', '1'); } catch {} renderWide(); };
  if ($('homeAdd')) $('homeAdd').onclick = () => { tab = 'list'; view.bucket = 'all'; view.form = {mode:'new'}; view.sel = null; renderAll(); };
  w.querySelectorAll('[data-hdone]').forEach(b => b.onchange = async () => {
    if (!b.checked) return;
    b.disabled = true;
    const [kind, id, idx] = b.dataset.hdone.split(':'), now = new Date().toISOString();
    if (kind === 'pjm') { await pjSetMs(id, Number(idx), true); return; }
    if (kind === 'pja') { await pjSetAg(id, Number(idx), 'done'); return; }
    if (kind === 'act') { await save(() => db.doc('activities/' + id).update({status:'완료', updatedAt:now}), '완료로 표시했습니다', id); return; }
    if (kind === 'due') { await save(() => db.doc('activities/' + id).update({nextDone:true, updatedAt:now}), '후속 조치를 완료로 표시했습니다', id); return; }
    const c = companies.find(x => x._id === id); if (!c) return;
    const aid = 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const ok = await save(() => db.doc('activities/' + aid).set({companyId:c._id, date:c.nextDate || now, type:'메모', status:'완료', title:c.nextAction || '다음 액션', summary:'한눈에 보기에서 다음 액션 완료 처리', createdAt:now, updatedAt:now}), '다음 액션을 완료하고 히스토리에 남겼습니다', c.name);
    if (ok) await save(() => db.doc('companies/' + c._id).update({nextDate:'', nextAction:'', updatedAt:now}));
  });
}

function renderDocForm(c){

  w.innerHTML = `<form class="f sub" id="docF">

    <label class="full">${assets ? '또는 링크 · 엑셀·한글 파일은 드라이브 링크로 추가하세요' : '링크 (드라이브·노션 등)'}<input id="dUrl" type="url" placeholder="https://"></label>

  $('docF').onsubmit = async e => {
    e.preventDefault();
    const file = $('dFile')?.files?.[0], url = $('dUrl').value.trim(), kind = $('dKind').value, name = $('dName').value.trim();
    if (!file && !url) { toast('파일을 고르거나 링크를 넣어 주세요'); return; }
    const entry = {kind, at:new Date().toISOString()};
    if (file) {
      const ext = (file.name.split('.').pop() || '').toLowerCase(), type = ACCEPT[ext];
      if (!type) { toast('PDF·이미지·텍스트만 올릴 수 있습니다. 엑셀·한글은 링크로 추가하세요'); return; }
      if (file.size > 20*1024*1024) { toast('20MB 이하 파일만 올릴 수 있습니다'); return; }
      const btn = $('dSave'); btn.disabled = true; btn.textContent = '올리는 중…';
      try { const r = await assets.upload(file, {type}); entry.id = r.id; entry.size = r.sizeBytes; entry.type = r.contentType; }
      catch (err) { toast(err && /quota/.test(err.code||'') ? '파일 저장 공간이 부족합니다' : '파일을 올리지 못했습니다. 다시 시도해 주세요'); btn.disabled = false; btn.textContent = '추가'; return; }
      entry.name = name || file.name;
    } else {
      if (!/^https?:\/\//i.test(url)) { toast('http:// 또는 https://로 시작하는 링크만 넣을 수 있습니다'); return; }
      entry.url = url; entry.name = name || url.replace(/^https?:\/\//i,'').slice(0,60);
    }
    const docs = [...(c.docs||[]), entry];
    if (await save(() => db.doc('companies/' + c._id).update({docs, updatedAt:new Date().toISOString()}), '문서를 추가했습니다', `${c.name} · ${entry.name}`)) { view.docForm = null; renderAll(); }
  };
}

async function genQuote(b, c, f){
  if (!downloads) { toast('이 화면에서는 파일을 받을 수 없습니다'); return; }
  let X; try { X = await loadXLSX(); } catch { toast('엑셀 모듈을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요'); return; }
  const m = Number(b.margin ?? 20), t = new Date(), p2 = n => String(n).padStart(2,'0');
  const ds = `${t.getFullYear()}.${p2(t.getMonth()+1)}.${p2(t.getDate())}`;
  const rows = [['견  적  서'], [], ['수신', `${c.name} 귀중`, '', '', '견적번호', f.no], ['참조', c.contactPerson || '', '', '', '견적일', ds],
    ['건명', b.title || '', '', '', '유효기간', `견적일로부터 ${f.days}일`], ['공급자', f.from, '', '', '담당', f.by], [],
    ['아래와 같이 견적합니다.'], [], ['No', '품명', '모델·규격', '수량', '단가', '금액', '비고']];
  const first = rows.length; let n = 0, sum = 0;
  for (const it of b.items||[]) { const q = Number(it.qty)||0, u = unitPrice(it, m), a = q*u; sum += a; rows.push([++n, it.category, it.model || '', q, u, a, '']); }
  const labor = Number(b.labor)||0;
  if (labor) { rows.push([++n, '엔지니어링·설치', '시스템 통합, 설치·시운전', 1, labor, labor, '']); sum += labor; }
  const last = rows.length; const vat = Math.round(sum * 0.1);
  rows.push([], ['', '', '', '', '공급가액', sum], ['', '', '', '', '부가세', vat], ['', '', '', '', '합계', sum + vat], [], ['비고', f.note]);
  const ws = X.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:6},{wch:18},{wch:30},{wch:7},{wch:14},{wch:16},{wch:34}];
  ws['!merges'] = [{s:{r:0,c:0}, e:{r:0,c:6}}];
  for (let r = first; r < rows.length; r++) for (const col of [4,5]) { const ref = X.utils.encode_cell({r, c:col}); if (ws[ref] && typeof ws[ref].v === 'number') ws[ref].z = '#,##0'; }
  const wb = X.utils.book_new(); X.utils.book_append_sheet(wb, ws, '견적서');
  const out = X.write(wb, {bookType:'xlsx', type:'array'});
  try { await downloads.save({filename: `견적서_${c.name.replace(/[\\/:*?"<>|]/g,'')}_${f.no}.xlsx`, data: new Blob([out])}); toast('견적서를 저장했습니다'); }
  catch (e) { if (e?.code !== 'declined') toast('파일을 저장하지 못했습니다'); }
  void last;
}

function analysisHTML(){

    return `<div class="bars">${entries.map(([k,v]) => `<div class="barrow"><span>${esc(k)}</span><span class="bt"><i style="width:${(v/max*100).toFixed(1)}%;background:${color}"></i></span><span class="bv">${v}</span></div>`).join('')}</div>`; };

  return `<h3>왜 됐고, 왜 안 됐나</h3><div class="muted" style="margin-bottom:10px">단계를 선정·계약·보류·드랍으로 바꿀 때 고른 사유가 모입니다.</div>
    <div class="two"><div><h4>성사 요인 (${winCos.length}곳)</h4>${bars(tally(winCos, c => c.outcomeReason), 'var(--s-win)')}</div>
    <div><h4>보류·드랍 사유 (${stopCos.length}곳)</h4>${bars(tally(stopCos, c => c.outcomeReason), 'var(--s-stop)')}</div></div>
    ${stopCos.some(c => c.outcomeNote) ? `<h4>보류·드랍 메모</h4><ul class="docs">${stopCos.filter(c => c.outcomeNote).map(c => `<li><span class="tag">${esc(c.outcomeReason || '미기록')}</span><button class="linkbtn" type="button" data-go="${c._id}">${esc(c.name)}</button><span>${esc(c.outcomeNote)}</span></li>`).join('')}</ul>` : ''}
    <h3>단계 분포</h3>${bars(stageDist, 'var(--s-meet)')}
    <h3>영업 구분별 성과</h3>${perf(c => c.channel)}

// ---------- 대표 보고 ----------
const RP_STEPS = ['리드·컨택','미팅·방문','제안·과제','선정·계약'];
const RP_GI = {lead:0, meet:1, prop:2, win:3};
const RP_ORDER = ['win','prop','meet','lead','stop'];
let rpText = '', rpShowText = false;
const rpLines = (s, n) => String(s || '').split('\n').map(x => x.replace(/^[-·•\s]+/, '').trim()).filter(Boolean).slice(0, n);
const rpShort = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getMonth()+1}/${d.getDate()}`; };
const rpActs = id => acts.filter(a => a.companyId === id && a.status !== '취소').sort((a,b) => String(b.date || '').localeCompare(String(a.date || '')));
function rpReached(c, as){
  if (!STOP.includes(c.stage)) return RP_GI[GROUP(c.stage)] ?? 0;
  if (as.some(a => a.status === '완료' && ['제안·발표','계약'].includes(a.type))) return 2;
  if (as.some(a => a.status === '완료' && ['첫 미팅','현장 방문'].includes(a.type))) return 1;
  return 0;
}
function reportData(){
  const rank = c => RP_ORDER.indexOf(GROUP(c.stage)) * 100 - STAGES.indexOf(c.stage);
  return customers().sort((a,b) => rank(a) - rank(b) || String(b.updatedAt || '').localeCompare(String(a.updatedAt || ''))).map(c => {
    const as = rpActs(c._id), rep = as.find(a => a.report)?.report || {};
    const stopped = STOP.includes(c.stage);
    const blockers = stopped ? [c.outcomeNote, c.outcomeReason && `사유: ${c.outcomeReason}`].filter(Boolean) : rpLines(rep.blockers, 2);
    return {c, as, stopped, blockers, reached: rpReached(c, as)};
  });
}
function reportHTML(){
  const cust = customers();
  if (!cust.length) return '<h3>대표 보고</h3><div class="empty">고객사를 추가하면 진행 현황과 히스토리가 여기에 모입니다.</div>';
  const showCard = x => ['meet','prop','win'].includes(GROUP(x.c.stage)) || daysSince(lastContact(x.c)) <= 60;
  const now = new Date(), data = reportData();
  const cnt = g => cust.filter(c => GROUP(c.stage) === g).length;
  const live = cust.filter(c => !STOP.includes(c.stage) && !WIN.includes(c.stage)).length;
  const since = Date.now() - 14 * 864e5;
  const recent = acts.filter(a => a.status === '완료' && a.date && new Date(a.date).getTime() >= since).length;
  const planned = acts.filter(a => a.status === '예정' && a.date && new Date(a.date) >= now).length;
  const kpis = [[live, '진행 중'], [cnt('win'), '선정·계약'], [cnt('stop'), '보류·드랍'], [recent, '최근 2주 미팅·접점'], [planned, '잡힌 일정']];
  const board = ['lead','meet','prop','win','stop'].map(g => { const cs = data.filter(x => GROUP(x.c.stage) === g);
    return `<div class="rp-col" style="--c:var(--s-${g})"><h5>${esc(GROUP_LABEL[g])}<b>${cs.length}</b></h5>${cs.length ? cs.map(x => `<button type="button" data-rpjump="${esc(x.c._id)}">${esc(x.c.name)}</button>`).join('') : '<span class="none">없음</span>'}</div>`; }).join('');
  const card = ({c, as, stopped, blockers, reached}) => {
    const g = GROUP(c.stage);
    const steps = RP_STEPS.map((s, i) => `<span class="${i < reached || (stopped && i === reached) ? 'done' : !stopped && i === reached ? 'on' : ''}">${s}</span>`).join('');
    const link = [c.program, c.govLink && `지원사업 ${c.govLink}`, c.applyTiming && c.applyTiming !== '미정' && `신청 ${c.applyTiming}`].filter(Boolean).join(' · ');
    const tl = as.length ? `<ol class="rptl">${as.map(a => `<li><span class="date">${rpShort(a.date)}</span><div><span class="ty">${esc(a.type)}</span>${esc(a.title || '')}${a.status === '예정' ? ' <span class="muted">(예정)</span>' : ''}${a.summary ? `<div class="sm">${esc(a.summary)}</div>` : ''}</div></li>`).join('')}</ol>` : '<div class="muted">기록된 접점이 없습니다.</div>';
    return `<article class="rpcard ${stopped ? 'stopped' : ''}" id="rp-${esc(c._id)}">
      <div class="rph"><div><h4>${esc(c.name)}</h4><div class="muted">${esc([regionLabel(c), c.industry, c.channel, c.source].filter(Boolean).join(' · '))}</div></div><span class="chip"><i style="background:var(--s-${g})"></i>${esc(c.stage)}</span></div>
      <div class="rpsteps" aria-label="진행 단계">${steps}</div>
      <dl class="kv rpkv">
        ${c.owner || c.dept ? `<dt>우리 담당</dt><dd>${esc([c.dept, c.owner].filter(Boolean).join(' · '))}</dd>` : ''}
        ${c.contactPerson ? `<dt>고객 담당</dt><dd>${esc(c.contactPerson)}</dd>` : ''}
        ${c.needs ? `<dt>니즈</dt><dd>${esc(c.needs)}</dd>` : ''}
        ${link ? `<dt>연계 사업</dt><dd>${esc(link)}</dd>` : ''}
        ${blockers.length ? `<dt>${stopped ? '보류 사유' : '막힌 점'}</dt><dd class="blk">${blockers.map(esc).join('<br>')}</dd>` : ''}
      </dl>
      ${c.nextAction ? `<div class="next"><b>다음</b> ${esc(c.nextAction)}</div>` : ''}
      <div><div class="subhead" style="margin-bottom:8px">히스토리 (${as.length})</div>${tl}</div>
      <div class="rpfoot"><span class="muted">최근 업데이트 ${esc(fmtDate(c.updatedAt || c.createdAt || ''))}</span><button class="linkbtn" type="button" data-go="${esc(c._id)}">업체 상세 열기</button></div>
    </article>`;
  };
  rpText = [`[B2B 영업 현황] ${fmtDate(now.toISOString()).slice(0,10)} 기준`, `진행 ${live} · 선정·계약 ${cnt('win')} · 보류·드랍 ${cnt('stop')}`, '',
    ...data.filter(showCard).map(({c, as, blockers, stopped}) => [`■ ${c.name} (${c.stage})`, c.needs && `- 니즈: ${c.needs}`, c.nextAction && `- 다음: ${c.nextAction}`, blockers.length && `- ${stopped ? '보류 사유' : '막힌 점'}: ${blockers.join(' / ')}`, as.length && `- 히스토리: ${as.slice().reverse().map(a => `${rpShort(a.date)} ${a.type}`).join(' → ')}`].filter(Boolean).join('\n') + '\n')].join('\n');
  return `<div class="rp-top"><div><h3>B2B 영업 현황 보고</h3><div class="muted">${esc(fmtDate(now.toISOString()).slice(0,10))} 기준 · 고객사 ${cust.length}곳 · 전략사업부</div></div><button class="btn" type="button" id="rpCopy">보고 내용 복사</button></div>
    <div class="rp-copy" id="rpCopyBox" ${rpShowText ? '' : 'hidden'}><label class="muted" for="rpTxt">자동 복사가 막혀 있어요. 아래 내용을 선택해 복사하세요.</label><textarea id="rpTxt" readonly>${esc(rpText)}</textarea></div>
    <div class="rp-kpis">${kpis.map(([v, l]) => `<div class="rp-kpi"><b>${v}</b><span>${l}</span></div>`).join('')}</div>

}
function wireReport(w){
  w.querySelectorAll('[data-rpjump]').forEach(b => b.onclick = () => { const el = document.getElementById('rp-' + b.dataset.rpjump); if (!el) { goCompany(b.dataset.rpjump); return; } if (el) el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); });

  if (g === 'half') for (let i = 0; i < 2; i++) P.push({key:'H' + (i+1), label:`${i ? '하' : '상'}반기`, start:new Date(Y, i*6, 1), end:new Date(Y, i*6+6, 1), share:.5});
  if (g === 'quarter') for (let i = 0; i < 4; i++) P.push({key:'Q' + (i+1), label:`${i+1}분기`, start:new Date(Y, i*3, 1), end:new Date(Y, i*3+3, 1), share:.25});
  if (g === 'month') for (let i = 0; i < 12; i++) P.push({key:'M' + pad2(i+1), label:`${i+1}월`, start:new Date(Y, i, 1), end:new Date(Y, i+1, 1), share:1/12});

}

function drawMunicipalPins(svg, m, list, scale){
  const b = bboxOfPath(m.d), W = b.maxx - b.minx, H = b.maxy - b.miny, n = list.length;
  const g = document.createElementNS(NS, 'g');
  if (!n) { svg.append(g); return; }
  const cols = Math.max(1, Math.min(n, Math.round(Math.sqrt(n * (W / H) / 2.2)) || 1)), rows = Math.ceil(n / cols);
  const cw_ = W * .9 / cols, ch = H * .86 / rows, x0 = b.minx + W * .05, y0 = b.miny + H * .07;
  const r = Math.max(scale * 2.2, Math.min(ch * .16, cw_ * .07));
  list.forEach((c, i) => {
    const x = x0 + (i % cols + .5) * cw_, y = y0 + (Math.floor(i / cols) + .32) * ch;
    const fs = Math.min(ch * .24, cw_ * .92 / Math.max(3, c.name.length * .98));
    const ci = document.createElementNS(NS, 'circle'); ci.setAttribute('cx', x); ci.setAttribute('cy', y); ci.setAttribute('r', r);
    ci.setAttribute('fill', `var(--s-${COLOR(c)})`); ci.setAttribute('class', 'pin' + (view.sel === c._id ? ' sel' : '')); ci.setAttribute('stroke-width', String(r * .28));
    ci.setAttribute('tabindex', '0'); ci.setAttribute('role', 'button'); ci.setAttribute('aria-label', `${c.name} · ${c.stage}`);
    const go = e => { e.stopPropagation(); select(c._id); };
    ci.addEventListener('click', go); ci.addEventListener('keydown', e => { if (e.key === 'Enter') go(e); });
    const t = document.createElementNS(NS, 'title'); t.textContent = `${c.name} · ${c.stage}${c.owner ? ' · ' + c.owner : ''}`; ci.append(t);
    const tx = document.createElementNS(NS, 'text'); tx.setAttribute('x', x); tx.setAttribute('y', y + r + fs * 1.05); tx.setAttribute('class', 'pinlabel'); tx.style.fontSize = fs + 'px'; tx.style.strokeWidth = (fs * .28) + 'px'; tx.textContent = c.name;
    const hit = document.createElementNS(NS, 'rect'); hit.setAttribute('x', x - cw_ / 2); hit.setAttribute('y', y - r * 1.4); hit.setAttribute('width', cw_); hit.setAttribute('height', r * 2.4 + fs * 1.3); hit.setAttribute('fill', 'transparent'); hit.style.cursor = 'pointer'; hit.addEventListener('click', go);
    g.append(hit, ci, tx);
  });
  svg.append(g);
}
function bubble(svg, x, y, n, r, fs, label, onClick){
  const g = document.createElementNS(NS, 'g');
  const ci = document.createElementNS(NS, 'circle'); ci.setAttribute('cx', x); ci.setAttribute('cy', y); ci.setAttribute('r', r); ci.setAttribute('class', 'bub'); ci.setAttribute('stroke-width', String(r * .12));
  ci.setAttribute('tabindex', '0'); ci.setAttribute('role', 'button'); ci.setAttribute('aria-label', `${label} 업체 ${n}곳 · 눌러서 확대`);
  ci.addEventListener('click', e => { e.stopPropagation(); onClick(); }); ci.addEventListener('keydown', e => { if (e.key === 'Enter') onClick(); });
  const t = document.createElementNS(NS, 'title'); t.textContent = `${label} · ${n}곳`; ci.append(t);
  const tx = document.createElementNS(NS, 'text'); tx.setAttribute('x', x); tx.setAttribute('y', y); tx.setAttribute('class', 'bubt'); tx.style.fontSize = fs + 'px'; tx.textContent = n;

const PJ_STATUS = ['신청 예정','평가 중','수행 중','종료','선정 후 미체결','지위 미확정','미선정'];

  const fund = list.filter(isFund), conf = fund.filter(p => !['평가 중','신청 예정'].includes(p.status)), sel = conf.filter(isSel);

function revDeals(){
  const ps = projects.filter(p => isRev(p) && doingPj(p) && Number(p.amount) && (p.start || p.selectedAt)).map(p => ({amount:Number(p.amount), start:p.start || p.selectedAt, end:p.end || p.start || p.selectedAt, name:p.name}));
  const lk = linkedCoIds();
  const cs = customers().filter(c => c.contract?.date && Number(c.contract?.amount) && !lk.has(c._id)).map(c => ({amount:Number(c.contract.amount), start:c.contract.date, end:c.contract.date, name:c.name}));
  return ps.concat(cs);

function revIn(p, basis){
  let s = 0;
  for (const d of revDeals()) {
    if (basis !== 'alloc') { if (inP(d.start, p)) s += d.amount; continue; }
    const a = toDate(d.start), b = toDate(d.end); if (isNaN(a)) continue;
    if (isNaN(b) || b <= a) { if (inP(d.start, p)) s += d.amount; continue; }
    const end = new Date(b.getTime() + 864e5), ov = Math.min(end, p.end) - Math.max(a, p.start);
    if (ov > 0) s += d.amount * ov / (end - a);
  }
  return s;
}

function logIt(action, target){

async function save(fn, msg, target){
  if (!db) { toast('저장소에 연결되지 않아 저장할 수 없습니다'); return false; }
  try { await fn(); if (msg) toast(msg); if (target) logIt(msg, target); return true; }
  catch (e) {
    if (e && e.code === 'invalid_argument' && canWrite === null) { canWrite = false; renderAll(); toast('읽기 전용 권한이라 저장할 수 없습니다'); }
    else if (e && e.code === 'quota_exceeded') toast('저장 공간이 가득 찼습니다. 오래된 기록을 정리해 주세요');
    else toast('저장하지 못했습니다. 잠시 후 다시 시도해 주세요');
    return false;
  }
}
